<!doctype html>
<!-- Popup for starting a sequential sync from the active coding site. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePusher Sync</title>
    <style>
      body { min-width: 280px; padding: 12px; font: 14px/1.4 sans-serif; }
      label { display: block; margin: 0 0 10px; }
      input { box-sizing: border-box; display: block; margin-top: 4px; width: 100%; }
      button { width: 100%; padding: 8px; }
      #status { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>CodePusher</h1>
      <label for="limit">Max problems (blank = all)
        <input id="limit" name="limit" type="number" min="1" step="1">
      </label>
      <button id="sync" type="button">Sync all solutions for this site</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
