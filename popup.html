<!doctype html>
<!-- Popup for starting a sequential sync or rebuilding the Codeforces index. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePusher Sync</title>
    <style>
      body { min-width: 280px; padding: 12px; font: 14px/1.4 sans-serif; }
      label { display: block; margin: 0 0 10px; }
      input { box-sizing: border-box; display: block; margin-top: 4px; width: 100%; }
      button { width: 100%; margin-top: 8px; padding: 8px; }
      .checkbox { display: flex; align-items: center; gap: 8px; }
      .checkbox input { display: inline; width: auto; margin: 0; }
      #status { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>CodePusher</h1>
      <label for="limit">Max problems (blank = all)
        <input id="limit" name="limit" type="number" min="1" step="1">
      </label>
      <label class="checkbox" for="repush-existing">
        <input id="repush-existing" name="repush-existing" type="checkbox">
        Re-push existing solutions
      </label>
      <button id="sync" type="button">Sync all solutions for this site</button>
      <button id="rebuild-index" type="button" disabled>Rebuild index only (Codeforces)</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
