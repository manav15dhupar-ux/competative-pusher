<!doctype html>
<!-- Options page for saving the GitHub destination and token. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePusher Options</title>
  </head>
  <body>
    <main>
      <h1>CodePusher Options</h1>
      <form id="settings-form">
        <p>
          <label for="token">GitHub token</label>
          <input id="token" name="token" type="password" autocomplete="new-password">
        </p>
        <p>
          <label for="username">GitHub username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </p>
        <p>
          <label for="repo">Repository name</label>
          <input id="repo" name="repo" type="text" required>
        </p>
        <button type="submit">Save settings</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
